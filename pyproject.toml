[project]
name = "tcc-scraper"
version = "0.1.0"
description = "Pipeline de coleta de noticias e dados de mercado B3 para o Dataset 1.0"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "lxml>=5.2",
    "trafilatura>=1.9",
    "py3langid>=0.3",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Driver do MySQL. Extra separado porque quem roda so com PostgreSQL nao precisa.
mysql = [
    "pymysql>=1.1",
    "cryptography>=42",  # exigido pelo caching_sha2_password, padrao do MySQL 8
]
sentiment = [
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[project.scripts]
tcc-scraper = "tcc_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
