[project]
name = "tcc-scraper"
version = "0.1.0"
description = "Pipeline de coleta de noticias e dados de mercado B3 para o Dataset 1.0"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    # Unico banco do projeto: MySQL 8 (driver pymysql). cryptography e exigido pelo
    # caching_sha2_password, padrao do MySQL 8.
    "pymysql>=1.1",
    "cryptography>=42",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "lxml>=5.2",
    "trafilatura>=1.9",
    "py3langid>=0.3",
    "tenacity>=8.3",
    "tzdata>=2024.1",
    # LLM de fallback da juiza (padrao: claude-haiku-5-5). No core: a juiza roda no daily local.
    "anthropic>=2.3",
]

[project.optional-dependencies]
# Analise diaria por Gemini (analyze-llm / cron do Railway). Extra separado: o scraper
# local nao precisa. A imagem do Railway instala `.[llm,sentiment]` (Dockerfile): a etapa
# `enriquecimento` depende do extra sentiment (torch ~2 GB, roda CPU).
llm = [
    "google-genai>=2.0",
]
sentiment = [
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[project.scripts]
tcc-scraper = "tcc_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
