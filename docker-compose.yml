services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc_scraper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc_local_dev
      POSTGRES_DB: tcc_scraper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc -d tcc_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
